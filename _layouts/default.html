<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Match the app's typography: Bricolage Grotesque (display),
       Inter Tight (body), JetBrains Mono (code). All on Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <!-- Ambient brand glows, anchored to viewport corners. Same trick the
       iOS app uses on the SignIn / Onboarding screens. -->
  <div class="glow glow-pink" aria-hidden="true"></div>
  <div class="glow glow-purple" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">
        <!-- Stylized SF "gamecontroller.fill" silhouette to mirror the app's BrandMark. -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 8h12a4 4 0 0 1 4 4v4a4 4 0 0 1-7.2 2.4L13 16h-2l-1.8 2.4A4 4 0 0 1 2 16v-4a4 4 0 0 1 4-4zm0 5h2v-2h2v2h2v2H10v2H8v-2H6v-2zm10 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm2 3a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
        </svg>
      </span>
      <span class="brand-name">TaliCompanion</span>
    </a>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/support.html' | relative_url }}">Support</a>
      <a href="{{ '/privacy.html' | relative_url }}">Privacy</a>
    </nav>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      &copy; 2026 TaliCompanion. Not affiliated with Legend Story
      Studios, Talishar, Google, or Apple. Flesh and Blood is a
      trademark of Legend Story Studios.
    </p>
  </footer>
</body>
</html>
